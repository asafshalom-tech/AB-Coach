<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="A/B Coach"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>המאמן שלי | A/B</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#eaf1fb;background:#0b1120;--panel:#151f32;--muted:#94a3b8;--line:#2b3850;--accent:#68e0b4;--blue:#7eb9ff}
*{box-sizing:border-box}body{margin:0;padding-bottom:88px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
header{padding:22px 18px 16px;background:linear-gradient(135deg,#172d42,#101827);border-bottom:1px solid var(--line)}
.wrap{max-width:750px;margin:auto;padding:0 15px}header .wrap{padding:0}h1{font-size:26px;margin:4px 0}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 9px}
.muted{color:var(--muted)}.small{font-size:13px}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#101827f5;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 6px max(8px,env(safe-area-inset-bottom))}
nav button{background:none;color:#9badc5;border:0;padding:9px 13px;border-radius:12px;flex:1;max-width:180px;font-size:13px}nav button.active{color:var(--accent);background:#203347}
main{padding-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;margin:0 0 14px;box-shadow:0 10px 25px #00000012}
.hero{background:linear-gradient(135deg,#213d4c,#16253b)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.wrap{flex-wrap:wrap}.stack{display:grid;gap:10px}
.btn{border:0;border-radius:13px;padding:12px 16px;background:var(--accent);color:#09251d;font-weight:800}.btn.alt{background:#273b52;color:#e9f3ff}.btn.ghost{background:transparent;border:1px solid var(--line);color:#dce8f8}.btn.danger{background:#54323a;color:#ffe5e5}.btn.sm{padding:8px 11px;font-size:13px}.btn.wide{width:100%}
.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border-radius:999px;background:#263b4d;padding:6px 10px;font-size:12px;color:#c8deee}.pill.good{background:#1c493d;color:#9df4c9}
.score{font-size:36px;font-weight:900;color:var(--accent);line-height:1}.big{font-size:24px;font-weight:800}
input,select{background:#0d1728;border:1px solid #40516a;color:#fff;border-radius:11px;padding:11px;min-width:0;width:100%}
input[type=number]{direction:ltr;text-align:center}.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.setgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.set{border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center;background:#101b2d}.set.current{border-color:var(--accent)}.set.done{background:#193d34}.set .value{font-size:23px;font-weight:800}
.counter{display:flex;gap:8px;align-items:center;justify-content:center;margin:17px 0}.counter button{font-size:28px;width:60px;height:57px;border:1px solid #3e516b;border-radius:15px;color:#fff;background:#27394e}.counter input{font-size:34px;font-weight:900;width:112px;height:67px}
.progress{height:7px;background:#28374c;border-radius:99px;overflow:hidden;margin:13px 0}.progress div{height:100%;background:var(--accent);transition:width .2s}
.exercise{padding:13px;border:1px solid var(--line);border-radius:14px;margin-bottom:9px}.exercise.current{border-color:var(--accent);background:#1b3040}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi>div{background:#101b2d;padding:12px 8px;border-radius:12px;text-align:center}.kpi strong{display:block;font-size:22px;color:#eafff6}
.note{border-right:3px solid var(--accent);padding:9px 12px;background:#193341;border-radius:8px;font-size:14px}
.hidden{display:none!important}.space{margin-top:14px}.gap{gap:8px}.subtle{border-top:1px solid var(--line);margin:14px 0}.listitem{padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}
.tag{font-size:12px;background:#273b52;border-radius:8px;padding:4px 7px}.formrow{display:grid;grid-template-columns:1fr 100px 80px;gap:7px;align-items:center;margin:8px 0}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#e1fff1;color:#0c3025;padding:11px 18px;border-radius:12px;z-index:10;box-shadow:0 10px 25px #0007;max-width:90vw}
@media(max-width:400px){.formrow{grid-template-columns:1fr 76px 65px}.card{padding:14px}.kpi strong{font-size:19px}}
</style></head>
<body><header><div class="wrap"><div class="eyebrow">YOUR PROGRESS • EVERY SET</div><h1>המאמן שלי <span style="color:var(--accent)">A/B</span></h1><div class="muted small">כל חזרה נחשבת. כל אימון מתקדם.</div></div></header>
<main class="wrap" id="app"></main>
<nav id="nav"><button data-tab="home">🏠 ראשי</button><button data-tab="train">🏋️ אימון</button><button data-tab="history">📈 היסטוריה</button><button data-tab="plans">⚙️ תוכניות</button></nav>
<script>
const KEY='abcoach-v1';
const seed={
 A:[['Chest Press',80,'ק״ג',[12,11,8]],['Incline Chest Press',70,'ק״ג',[10,9,7]],['Incline Curl',15,'ק״ג',[12,12,11]],['Hammer Curl',17.5,'ק״ג',[12,12,12]],['Preacher Curl',27.5,'ק״ג',[12,11,10]],['Leg Press',160,'ק״ג',[12,12,12]],['Leg Extension',70,'ק״ג',[12,12,12]],['Lying Leg Curl',65,'lb',[12,12,10]]],
 B:[['Pull-ups',0,'משקל גוף',[21,16,13]],['Lat Pulldown',72.5,'ק״ג',[8,9,9]],['Chest-Supported Row',35,'ק״ג',[12,11,11]],['Seated Shoulder Press',25,'ק״ג',[12,11,9]],['Lateral Raise',12.5,'ק״ג',[12,12,12]],['Triceps Pushdown',28.75,'ק״ג',[14,14,12]],['Overhead Triceps Extension',31.25,'ק״ג',[14,13,13]],['Leg Press Calf Raise',60,'ק״ג',[15,13,13]]],
 Core:[['Crunch',12,'ק״ג',[30,30,23]],['Flutter Kicks',0,'משקל גוף',[30,30,30]],['Heel Touches',0,'משקל גוף',[30,31,35]],['Plank',0,'שניות',[190]]]
};
const defaults=()=>({plans:Object.fromEntries(Object.entries(seed).map(([k,v])=>[k,v.map((a,i)=>({id:k+'-'+i,name:a[0],weight:a[1],unit:a[2],targets:a[3],baseline:a[3]}))])),history:[],active:null,tab:'home'});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults();if(!state.plans||!state.history)throw 1;}catch(e){state=defaults()}
let tab=state.tab||'home',repInput=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,writeQueue=Promise.resolve();
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('ab-coach-database',1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('app'))d.createObjectStore('app')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbRead(){return new Promise((resolve,reject)=>{let tx=db.transaction('app','readonly'),req=tx.objectStore('app').get('state');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbWrite(snapshot){return new Promise((resolve,reject)=>{let tx=db.transaction('app','readwrite');tx.objectStore('app').put(snapshot,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
const save=()=>{state.tab=tab;const snapshot=structuredClone(state);if(db){writeQueue=writeQueue.catch(()=>{}).then(()=>dbWrite(snapshot)).catch(e=>{console.error('Database save failed',e);toast('שגיאה בשמירה — ייצא גיבוי')})}else{try{localStorage.setItem(KEY,JSON.stringify(snapshot))}catch(e){toast('אחסון מלא — ייצא גיבוי')}}};
async function initialize(){try{db=await openDB();let stored=await dbRead();if(stored?.plans?.A&&stored?.plans?.B&&Array.isArray(stored.history)){state=stored;tab=state.tab||'home'}else{save()}try{localStorage.removeItem(KEY)}catch(e){}}catch(e){console.warn('IndexedDB unavailable, localStorage fallback',e);toast('מסד הנתונים לא זמין — שמירה מקומית מוגבלת')}render();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}
const el=()=>document.getElementById('app');
const total=a=>a.reduce((x,y)=>x+(Number(y)||0),0);
const round=x=>Math.round(x*10)/10;
function prior(type,id){return [...state.history].reverse().flatMap(w=>w.type===type?w.exercises:[]).find(e=>e.id===id&&e.sets.some(v=>v!==null))||null}
function target(e,type){const p=prior(type,e.id);if(!p)return [...e.targets];let t=[...e.targets];const last=p.sets.filter(x=>x!==null);if(last.length===t.length&&last.every((v,i)=>v>=t[i])){let ix=last.indexOf(Math.min(...last));t[ix]+=1}return t}
function score(sets,t){let count=0,sum=0;sets.forEach((n,i)=>{if(n!==null){count++;sum+=Math.min(110,(n/(t[i]||1))*100)}});return count?round(Math.min(10,sum/count/10)):null}
function badge(n){return n===null?'—':n.toFixed(1)+'/10'}
function weight(e){return e.unit==='משקל גוף'?'משקל גוף':e.weight+' '+e.unit}
function toast(msg){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function start(type){if(state.active&&!confirm('יש אימון פתוח. להחליף אותו?'))return;state.active={type,started:new Date().toISOString(),index:0,exercises:state.plans[type].map(e=>({...structuredClone(e),targets:target(e,type),sets:e.targets.map(()=>null)}))};tab='train';save();render()}
function nextOpen(w){let i=w.exercises.findIndex(e=>e.sets.some(s=>s===null));return i===-1?w.exercises.length:i}
function completed(w){return w.exercises.reduce((s,e)=>s+e.sets.filter(v=>v!==null).length,0)}
function allSets(w){return w.exercises.reduce((s,e)=>s+e.sets.length,0)}
function workoutScore(w){let values=w.exercises.map(e=>score(e.sets,e.targets)).filter(v=>v!==null);return values.length?round(values.reduce((a,b)=>a+b,0)/values.length):null}
function suggestion(e,type){let p=prior(type,e.id);if(!p)return 'אימון בסיס — נבנה יעד מדויק מהביצועים שלך.';let complete=p.sets.length===e.targets.length&&p.sets.every(v=>v!==null);let met=complete&&p.sets.every((v,i)=>v>=p.targets[i]);if(met&&p.sets.every(v=>v>=12)&&e.weight>0&&e.unit!=='שניות')return 'מוכן לשקול עלייה קטנה במשקל (כ־2%–5%) אם הטכניקה נקייה. אחרי העלייה כוון ל־8–10 חזרות.';if(met)return 'מומלץ להוסיף חזרה אחת באחד הסטים, תוך שמירה על המשקל והטכניקה.';return 'לשמור על המשקל ולהשלים קודם את יעד החזרות הקודם.'}
function renderHome(){let last=state.history.at(-1);el().innerHTML=`<div class="card hero"><div class="eyebrow">היום מתקדמים</div><h2 class="space">איזה אימון עושים?</h2><div class="row gap"><button class="btn" onclick="start('A')">אימון A</button><button class="btn" onclick="start('B')">אימון B</button><button class="btn alt" onclick="start('Core')">בטן</button></div>${state.active?`<div class="space note">יש אימון ${state.active.type} פתוח · <button class="btn sm alt" onclick="go('train')">המשך אימון</button></div>`:''}</div><div class="kpi"><div><strong>${state.history.length}</strong><span class="muted small">אימונים</span></div><div><strong>${last?badge(workoutScore(last)):'—'}</strong><span class="muted small">ציון אחרון</span></div><div><strong>${state.history.reduce((n,w)=>n+completed(w),0)}</strong><span class="muted small">סטים שתועדו</span></div></div><div class="card space"><h2>הצעד הבא שלך</h2>${['A','B'].map(type=>`<div class="listitem"><b>אימון ${type}</b><div class="small muted">${state.plans[type].length} תרגילים</div><div class="small space">${esc(suggestion(state.plans[type][0],type))}</div></div>`).join('')}<div class="small muted space">היסטוריית הבסיס שהוגדרה לפי האימונים האחרונים שלך משמשת לקביעת היעדים. אימונים חדשים נשמרים במכשיר זה.</div></div>`}
function renderTrain(){let w=state.active;if(!w){el().innerHTML=`<div class="card"><h2>אין אימון פעיל</h2><p class="muted">בחר אימון כדי להתחיל מעקב סט־אחר־סט.</p><div class="row gap"><button class="btn" onclick="start('A')">התחל A</button><button class="btn" onclick="start('B')">התחל B</button><button class="btn alt" onclick="start('Core')">בטן</button></div></div>`;return}
let i=Math.min(w.index,w.exercises.length-1),e=w.exercises[i],setIndex=e.sets.indexOf(null),done=setIndex<0,t=e.targets,prev=prior(w.type,e.id),s=score(e.sets,t);
let candidate=done?null:t[setIndex];
el().innerHTML=`<div class="card hero"><div class="row"><div><div class="eyebrow">אימון ${w.type}</div><h2>${completed(w)} מתוך ${allSets(w)} סטים</h2></div><div style="text-align:left"><div class="score">${badge(workoutScore(w))}</div><div class="small muted">ציון עד כה</div></div></div><div class="progress"><div style="width:${100*completed(w)/allSets(w)}%"></div></div></div>
<div class="card"><div class="row"><div><div class="eyebrow">תרגיל ${i+1} מתוך ${w.exercises.length}</div><h2>${esc(e.name)}</h2><div class="pills"><span class="pill">${esc(weight(e))}</span><span class="pill">יעד ${t.join(' / ')}</span></div></div><div style="text-align:left"><div class="score">${badge(s)}</div><span class="muted small">ציון תרגיל</span></div></div>
<div class="setgrid space">${t.map((v,j)=>`<div class="set ${e.sets[j]!==null?'done':j===setIndex?'current':''}"><div class="small muted">סט ${j+1}</div><div class="value">${e.sets[j]===null?'—':e.sets[j]}</div><div class="small muted">יעד ${v}</div>${e.sets[j]!==null?`<button class="btn ghost sm space" onclick="editSet(${i},${j})">ערוך</button>`:''}${e.sets[j]!==null?`<div class="small" style="color:var(--accent)">${badge(score([e.sets[j]],[v]))}</div>`:''}</div>`).join('')}</div>
${!done?`<div class="space small muted" style="text-align:center">כמה חזרות ביצעת בסט ${setIndex+1}?</div><div class="counter"><button onclick="changeRep(-1)">−</button><input id="reps" type="number" min="0" max="999" step="${e.unit==='שניות'?1:0.5}" value="${candidate}"><button onclick="changeRep(1)">+</button></div><button class="btn wide" onclick="record()">שמור סט ✓</button>`:`<div class="note space">התרגיל הושלם! ${s>=9.5?'ביצוע מצוין.':'ממשיכים לבנות עקביות.'}</div>`}
<div class="subtle"></div><div class="small muted">אימון קודם: ${prev?prev.sets.map(v=>v===null?'—':v).join(' / '):'נתוני בסיס בלבד'} · ${esc(suggestion(e,w.type))}</div></div>
<div class="card"><div class="row gap"><button class="btn alt" onclick="step(-1)" ${i===0?'disabled':''}>הקודם</button><button class="btn alt" onclick="step(1)" ${i===w.exercises.length-1?'disabled':''}>הבא ←</button></div><div class="space">${w.exercises.map((x,j)=>`<div class="exercise ${j===i?'current':''}" onclick="selectExercise(${j})"><div class="row"><div><b>${j+1}. ${esc(x.name)}</b><div class="small muted">${esc(weight(x))} · ${x.sets.map(v=>v===null?'–':v).join(' / ')}</div></div><div><b>${badge(score(x.sets,x.targets))}</b></div></div></div>`).join('')}</div><button class="btn wide" onclick="finish()">סיים אימון ושמור סיכום</button><button class="btn danger wide space" onclick="discard()">בטל אימון</button></div>`}
function changeRep(d){let a=document.getElementById('reps');a.value=Math.max(0,(Number(a.value)||0)+d)}
function record(){let w=state.active,e=w.exercises[w.index],j=e.sets.indexOf(null),v=Number(document.getElementById('reps').value);if(j<0||!Number.isFinite(v)||v<0||v>999)return toast('הזן מספר חזרות תקין');e.sets[j]=v;let ss=score([v],[e.targets[j]]);save();toast('סט נשמר · ציון '+badge(ss));if(e.sets.every(x=>x!==null)&&w.index<w.exercises.length-1)w.index++;save();render()}
function editSet(i,j){let e=state.active.exercises[i],v=prompt('עדכן חזרות לסט '+(j+1),e.sets[j]);if(v===null)return;v=Number(v);if(!Number.isFinite(v)||v<0)return toast('מספר לא תקין');e.sets[j]=v;save();render()}
function step(n){state.active.index=Math.max(0,Math.min(state.active.exercises.length-1,state.active.index+n));save();render()}
function selectExercise(i){state.active.index=i;save();render()}
function finish(){let w=state.active;if(!completed(w))return toast('לא הוזנו סטים');let incomplete=allSets(w)-completed(w);if(incomplete&&!confirm('נותרו '+incomplete+' סטים לא מתועדים. לסיים בכל זאת?'))return;w.ended=new Date().toISOString();state.history.push(w);state.active=null;tab='history';save();render();toast('האימון נשמר בהצלחה!')}
function discard(){if(confirm('למחוק את האימון הפעיל?')){state.active=null;save();render()}}
function renderHistory(){el().innerHTML=`<div class="row"><h2>היסטוריית אימונים</h2><span class="pill">${state.history.length} אימונים</span></div>${state.history.length?state.history.slice().reverse().map(w=>`<div class="card"><div class="row"><div><div class="eyebrow">אימון ${w.type}</div><h3>${new Date(w.started).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'})}</h3><div class="small muted">${completed(w)} סטים · ${w.exercises.filter(e=>e.sets.some(v=>v!==null)).length} תרגילים</div></div><div class="score">${badge(workoutScore(w))}</div></div><details class="space"><summary>הצג ביצועים</summary>${w.exercises.map(e=>`<div class="listitem row"><div><b>${esc(e.name)}</b><div class="small muted">${esc(weight(e))} · ${e.sets.map(v=>v===null?'–':v).join(' / ')}</div></div><span>${badge(score(e.sets,e.targets))}</span></div>`).join('')}</details></div>`).join(''):`<div class="card"><p>עדיין אין אימונים שמורים. התחל אימון כדי ליצור היסטוריה.</p></div>`}`}
function renderPlans(){el().innerHTML=`<h2>התוכניות שלי</h2><p class="muted small">אפשר לערוך משקלים ויעדי חזרות. השינויים ישפיעו על אימונים עתידיים, לא על היסטוריה שכבר נשמרה.</p>${['A','B','Core'].map(type=>`<div class="card"><h2>${type==='Core'?'בטן':'אימון '+type}</h2>${state.plans[type].map((e,i)=>`<div class="listitem"><div class="row"><b>${i+1}. ${esc(e.name)}</b><span class="tag">${esc(e.unit)}</span></div><div class="formrow"><label class="small muted">משקל<input id="w-${type}-${i}" type="number" step=".25" value="${e.weight}"></label><label class="small muted">יעד 1<input id="t-${type}-${i}-0" type="number" value="${e.targets[0]}"></label><button class="btn alt sm" onclick="savePlan('${type}',${i})">שמור</button></div><div class="row gap">${e.targets.slice(1).map((v,j)=>`<label class="small muted">סט ${j+2}<input id="t-${type}-${i}-${j+1}" type="number" value="${v}"></label>`).join('')}</div><div class="small muted space">${esc(suggestion(e,type))}</div></div>`).join('')}</div>`).join('')}
<div class="card"><h2>שיתוף עם ChatGPT</h2><p class="small muted">אפשר להעתיק סיכום אימון מובנה ולהדביק בצ׳אט. זהו שיתוף ידני בלבד, לא סנכרון אוטומטי.</p><button class="btn alt wide" onclick="copyForChat()">העתק סיכום אימון אחרון לצ׳אט</button></div><div class="card"><h2>גיבוי ופרטיות</h2><p class="small muted">הנתונים נשמרים ב־IndexedDB במכשיר זה בלבד, בכפוף למגבלות האחסון של המכשיר והדפדפן. אין הבטחה לאחסון בלתי מוגבל או לגיבוי ענן. מומלץ לייצא גיבוי תקופתי; מחיקת נתוני האתר עלולה למחוק את ההיסטוריה.</p><div class="row gap wrap"><button class="btn alt" onclick="exportData()">ייצוא גיבוי JSON</button><label class="btn alt" style="cursor:pointer">ייבוא גיבוי<input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label></div><button class="btn danger space" onclick="resetData()">איפוס כל הנתונים</button></div>`}
function savePlan(type,i){let e=state.plans[type][i],w=Number(document.getElementById(`w-${type}-${i}`).value),t=e.targets.map((_,j)=>Number(document.getElementById(`t-${type}-${i}-${j}`).value));if(!Number.isFinite(w)||w<0||t.some(x=>!Number.isFinite(x)||x<0))return toast('ערכים לא תקינים');e.weight=w;e.targets=t;save();toast('התוכנית עודכנה');render()}
function copyForChat(){let w=state.history.at(-1);if(!w)return toast('אין עדיין אימון שמור');let report=`סיכום אימון ${w.type} מתאריך ${new Date(w.started).toLocaleDateString('he-IL')}. ציון ${badge(workoutScore(w))}.\n`+w.exercises.filter(e=>e.sets.some(x=>x!==null)).map(e=>`${e.name} | ${weight(e)} | ${e.sets.map(x=>x===null?'דולג':x).join('/')} | ציון ${badge(score(e.sets,e.targets))}`).join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(report).then(()=>toast('הסיכום הועתק — הדבק אותו בצ׳אט')).catch(()=>window.prompt('העתק את הסיכום:',report))}else window.prompt('העתק את הסיכום:',report)}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='ab-coach-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.plans?.A||!x.plans?.B||!Array.isArray(x.history))throw 1;if(confirm('להחליף את כל הנתונים בגיבוי?')){state=x;save();render();toast('הגיבוי נטען')}}catch(e){toast('קובץ גיבוי לא תקין')}};r.readAsText(f)}
function resetData(){if(confirm('למחוק את כל האימונים וההגדרות? לא ניתן לבטל.')){state=defaults();tab='home';save();render()}}
function go(t){tab=t;save();render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home:renderHome,train:renderTrain,history:renderHistory,plans:renderPlans}[tab]||renderHome)()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
initialize();
</script></body></html>
